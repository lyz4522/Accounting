[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-accounting"
version = "1.0.0"
description = "A personal income and expense tracking desktop application."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["accounting*"]

